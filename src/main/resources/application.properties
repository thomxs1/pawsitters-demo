# =============================================================
# Standard-Konfiguration (Entwicklung, lokal)
# Wird ueberschrieben, wenn das "prod"-Profil aktiv ist
# (siehe application-prod.properties)
# =============================================================

# Server-Port - Plattformen wie Render setzen PORT via Env-Var
server.port=${PORT:8080}

# Datenbank: Default H2 In-Memory, kann durch DATABASE_URL ueberschrieben werden
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:pawsitters}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate - Driver und Dialekt erkennt Spring automatisch aus der URL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2-Konsole zum Debuggen unter http://localhost:8080/h2-console (lokal)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf - Caching im Dev abschalten
spring.thymeleaf.cache=false

# File-Uploads (Haustier-Bilder)
# Servlet-Limits etwas groesser als die Service-seitige Pruefung,
# damit eine sinnvolle Fehlermeldung kommt statt eines 500-Errors
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Demo-Daten-Passwoerter (siehe DataInitializer)
# In Produktion via Env-Vars ueberschreiben!
pawsitters.demo.password=${DEMO_PASSWORD:demo1234}
pawsitters.demo.admin-password=${ADMIN_PASSWORD:admin1234}

# Error-Details im Dev sichtbar - in application-prod.properties wieder abgeschaltet
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
