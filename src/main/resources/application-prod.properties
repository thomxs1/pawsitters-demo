# =============================================================
# Produktions-Profil
# Aktiv wenn SPRING_PROFILES_ACTIVE=prod gesetzt ist
# Wird zusaetzlich zu application.properties geladen und ueberschreibt
# einzelne Werte fuer den Produktionsbetrieb.
# =============================================================

# Thymeleaf cachen (Performance in Prod)
spring.thymeleaf.cache=true

# Keine SQL-Logs in Prod
spring.jpa.show-sql=false

# H2-Konsole hart abschalten - selbst wenn jemand H2 fahren wuerde, soll
# die Konsole nicht oeffentlich erreichbar sein
spring.h2.console.enabled=false

# Aktualisierungen am Schema in Prod nur kontrolliert
# "update" ist tolerant aber riskant - fuer ein Hobby-Projekt akzeptabel,
# fuer echte Produktion auf "validate" + Flyway/Liquibase wechseln
spring.jpa.hibernate.ddl-auto=update

# Datenbank-URL in Prod aus den Einzelteilen bauen, weil Render's
# connectionString im "postgres://..."-Format kommt - JDBC braucht aber
# "jdbc:postgresql://..."
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}

# Wenn DATABASE_URL gesetzt ist (Render/Railway), wird sie aus application.properties
# uebernommen. Lokal mit SPRING_PROFILES_ACTIVE=prod ohne DATABASE_HOST faellt's
# auf die obige Zeile mit leeren Platzhaltern zurueck - nur fuer Produktion gedacht.

# Logging
logging.level.root=INFO
logging.level.com.pawsitters=INFO
logging.level.org.springframework.security=WARN

# Error-Handling: keine Stack-Traces an den Client ausliefern
server.error.include-stacktrace=never
server.error.include-message=never

# Cookie-Sicherheit
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Forward-Headers-Strategie: Render/Railway/Fly liefern via Proxy aus,
# damit Spring den richtigen Scheme (https) und Host kennt
server.forward-headers-strategy=native
