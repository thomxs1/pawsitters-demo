<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meine Tiere &middot; Pawsitters</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/layout :: icon-sprite}"/>
<th:block th:replace="~{fragments/layout :: site-header}"/>

<main>
    <div class="page-header">
        <div>
            <h1>Meine Tiere</h1>
            <p class="subtitle">Alle Tiere, die du bei Pawsitters registriert hast.</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/pets/new}" class="btn">
                <svg width="16" height="16"><use href="#icon-plus"/></svg>
                Tier hinzufügen
            </a>
        </div>
    </div>

    <div class="card-list" th:if="${not #lists.isEmpty(pets)}">
        <article class="pet-card" th:each="p : ${pets}">
            <!-- Hero-Bild oder Placeholder -->
            <img th:if="${p.hasImage()}" class="pet-card-image"
                 th:src="@{'/pets/' + ${p.id} + '/image'}"
                 th:alt="'Foto von ' + ${p.name}"/>
            <div th:unless="${p.hasImage()}" class="pet-card-image-placeholder">
                <svg th:switch="${p.animalType.name()}">
                    <use th:case="'DOG'" href="#icon-dog"/>
                    <use th:case="'CAT'" href="#icon-cat"/>
                    <use th:case="'BIRD'" href="#icon-bird"/>
                    <use th:case="*" href="#icon-pet"/>
                </svg>
            </div>

            <div class="pet-card-body">
                <h2 class="pet-card-name" th:text="${p.name}"></h2>
                <div class="pet-card-meta">
                    <th:block th:replace="~{fragments/layout :: animal-pill(${p.animalType})}"/>
                    <span th:if="${p.age != null}">· <span th:text="${p.age}"></span> Jahre</span>
                </div>
                <p class="pet-card-notes" th:if="${p.notes != null and !p.notes.isEmpty()}"
                   th:text="${p.notes}"></p>
                <p class="pet-card-notes text-muted" th:if="${p.notes == null or p.notes.isEmpty()}"
                   style="font-style: italic;">
                    Keine Notizen hinterlegt.
                </p>

                <div class="pet-card-meta" sec:authorize="hasRole('ADMIN')">
                    <small class="text-muted">Besitzer: <span th:text="${p.owner.name}"></span></small>
                </div>

                <div class="pet-card-actions">
                    <!-- Bild aendern -->
                    <form th:action="@{'/pets/' + ${p.id} + '/image'}" method="post"
                          enctype="multipart/form-data" class="inline-form">
                        <label th:for="'image-' + ${p.id}" class="btn btn-sm btn-secondary" style="cursor:pointer;">
                            <svg width="14" height="14"><use href="#icon-plus"/></svg>
                            <span th:text="${p.hasImage()} ? 'Bild ändern' : 'Bild hinzufügen'"></span>
                        </label>
                        <input type="file" th:id="'image-' + ${p.id}" name="image"
                               accept="image/jpeg,image/png,image/webp,image/gif"
                               style="display:none;" onchange="this.form.submit()"/>
                    </form>

                    <form th:if="${p.hasImage()}" th:action="@{'/pets/' + ${p.id} + '/image/delete'}"
                          method="post" class="inline-form">
                        <button type="submit" class="btn btn-sm btn-ghost"
                                onclick="return confirm('Bild wirklich entfernen?');">
                            <svg width="14" height="14"><use href="#icon-x"/></svg>
                            Bild entfernen
                        </button>
                    </form>

                    <form th:action="@{'/pets/' + ${p.id} + '/delete'}" method="post" class="inline-form"
                          style="margin-left: auto;">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('Tier wirklich löschen?');">
                            Löschen
                        </button>
                    </form>
                </div>
            </div>
        </article>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(pets)}">
        <div class="empty-state-icon"><svg><use href="#icon-pet"/></svg></div>
        <h3>Noch keine Tiere registriert</h3>
        <p>Lege dein erstes Tier an, damit du Betreuungsanfragen stellen kannst.</p>
        <a th:href="@{/pets/new}" class="btn">
            <svg width="16" height="16"><use href="#icon-plus"/></svg>
            Erstes Tier anlegen
        </a>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}"/>
</body>
</html>
