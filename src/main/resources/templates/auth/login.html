<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anmelden &middot; Pawsitters</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/layout :: icon-sprite}"/>
<th:block th:replace="~{fragments/layout :: site-header}"/>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand">
                <svg class="brand-icon"><use href="#icon-paw"/></svg>
                <span>Pawsitters</span>
            </div>
            <h1>Willkommen zurück</h1>
            <p>Melde dich mit deinem Benutzernamen und Passwort an.</p>
        </div>

        <div class="alert alert-error" th:if="${param.error}">
            <svg class="alert-icon"><use href="#icon-warning"/></svg>
            <span>Benutzername oder Passwort ist falsch.</span>
        </div>
        <div class="alert alert-success" th:if="${param.registered}">
            <svg class="alert-icon"><use href="#icon-check"/></svg>
            <span>Registrierung erfolgreich! Du kannst dich jetzt anmelden.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username"/>
            </div>
            <div class="field">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"/>
            </div>
            <button type="submit" style="width: 100%; justify-content: center;">
                Anmelden
                <svg width="16" height="16"><use href="#icon-arrow-right"/></svg>
            </button>
        </form>

        <div class="auth-footer">
            Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: site-footer}"/>
</body>
</html>
